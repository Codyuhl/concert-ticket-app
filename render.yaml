services:
  - type: web
    name: concert-ticket-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: concert-ticket-db
          property: connectionString

databases:
  - name: concert-ticket-db
    plan: free
