{% extends "base.html" %}
{% block content %}
<h2>Add Artist</h2>

<form method="POST">
    <label for="artist_name">Artist Name</label>
    <input id="artist_name" type="text" name="artist_name" required>

    <label for="genre">Genre</label>
    <input id="genre" type="text" name="genre" required>

    <button type="submit">Add Artist</button>
</form>

<h3>Current Artists</h3>
<table>
    <tr>
        <th>ID</th>
        <th>Artist Name</th>
        <th>Genre</th>
    </tr>
    {% for artist in artists %}
    <tr>
        <td>{{ artist.artist_id }}</td>
        <td>{{ artist.artist_name }}</td>
        <td>{{ artist.genre }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
