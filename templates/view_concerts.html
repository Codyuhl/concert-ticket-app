{% extends "base.html" %}
{% block content %}
<h2>View Concerts</h2>

<form method="POST">
    <label for="city">Filter by City</label>
    <select id="city" name="city">
        <option value="">All Cities</option>
        {% for city in cities %}
        <option value="{{ city }}" {% if selected_city == city %}selected{% endif %}>{{ city }}</option>
        {% endfor %}
    </select>

    <button type="submit">Search</button>
</form>

<table>
    <tr>
        <th>Concert ID</th>
        <th>Artist</th>
        <th>Venue</th>
        <th>City</th>
        <th>Date</th>
    </tr>
    {% for concert in concerts %}
    <tr>
        <td>{{ concert.concert_id }}</td>
        <td>{{ concert.artist.artist_name }}</td>
        <td>{{ concert.venue.venue_name }}</td>
        <td>{{ concert.venue.city }}</td>
        <td>{{ concert.concert_date }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
